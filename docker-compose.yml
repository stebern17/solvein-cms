services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: solvein_cms_app
        restart: unless-stopped
        working_dir: /var/www
        ports:
            - "5173:5173"
        volumes:
            - ./:/var/www
        depends_on:
            - postgres
        networks:
            - solvein_cms_network

    nginx:
        image: nginx:alpine
        container_name: solvein_cms_nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - solvein_cms_network

    postgres:
        image: postgres:16
        container_name: solvein_cms_postgres
        restart: unless-stopped
        ports:
            - "5433:5432"
        environment:
            POSTGRES_DB: solvein_cms
            POSTGRES_USER: solvein_user
            POSTGRES_PASSWORD: solvein_password
        volumes:
            - solvein_cms_postgres_data:/var/lib/postgresql/data
        networks:
            - solvein_cms_network

    pgadmin:
        image: dpage/pgadmin4
        container_name: solvein_cms_pgadmin
        restart: unless-stopped
        ports:
            - "5050:80"
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@solvein.test
            PGADMIN_DEFAULT_PASSWORD: password
        depends_on:
            - postgres
        networks:
            - solvein_cms_network

networks:
    solvein_cms_network:

volumes:
    solvein_cms_postgres_data:
